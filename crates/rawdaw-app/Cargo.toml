[package]
name = "rawdaw-app"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "rawdaw"
path = "src/main.rs"

[dependencies]
rinch = { workspace = true, features = ["desktop", "components", "theme", "debug"] }
# `cpal-driver` enables the cpal-based real-time audio thread. Required
# for any audible output; the app launches the audio stream in
# `audio::AudioResources::build()`. No-cpal builds are not supported —
# rawdaw-app is the desktop binary, not a headless library.
rawdaw-engine = { path = "../rawdaw-engine", features = ["cpal-driver"] }
# `fixtures` feature pulls in `rawdaw_model::fixtures::build_round1_project()`,
# the canonical round-1 Project that drives rawdaw-app's UI. The fixture
# data ships in the binary at runtime — release builds still get the
# round-1 mockup data until project-file I/O lands.
rawdaw-model = { path = "../rawdaw-model", features = ["fixtures"] }
