[package]
name = "rawdaw-app"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "rawdaw"
path = "src/main.rs"

[dependencies]
rinch = { workspace = true, features = ["desktop", "components", "theme", "debug"] }
# `cpal-driver` enables the cpal-based real-time audio thread. Required
# for any audible output; the app launches the audio stream in
# `audio::AudioResources::build()`. No-cpal builds are not supported —
# rawdaw-app is the desktop binary, not a headless library.
rawdaw-engine = { path = "../rawdaw-engine", features = ["cpal-driver"] }
# `fixtures` feature pulls in `rawdaw_model::fixtures::build_round1_project()`,
# the canonical round-1 Project that drives rawdaw-app's UI. The fixture
# data ships in the binary at runtime — release builds still get the
# round-1 mockup data until project-file I/O lands.
rawdaw-model = { path = "../rawdaw-model", features = ["fixtures"] }
# The v0 wavetable/FM synth. The Melodic-role track in `configure_graph`
# uses this instead of the sine placeholder; bass / drums / pad still
# get the sine until their domain-specific synths land.
rawdaw-synth-wavetable = { path = "../rawdaw-synth-wavetable" }
# The v0 drum synth — replaces the sine placeholder for Drum tracks.
rawdaw-synth-drum = { path = "../rawdaw-synth-drum" }
# Master-output gain attenuator + future FX nodes.
rawdaw-fx = { path = "../rawdaw-fx" }
# JSON deserialization for the embedded U8 preset bank
# (`assets/presets/{wavetable,drum}/*.json`). v1 uses
# `include_str!` to bake presets into the binary; v2 may add a
# filesystem path for user presets, at which point this dep stays.
serde_json = "1"
# Cross-platform MIDI input. Wraps ALSA on Linux (libasound2-dev
# at build time), CoreMIDI on macOS, WinMM on Windows. Used by
# `src/midi_input/` to forward note events from a USB MIDI
# keyboard into the engine's MIDI input queue.
midir = "0.11"
