[package]
name = "rawdaw-fx"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# FX nodes are AudioNode implementations; they need the engine's
# trait + port types.
rawdaw-engine = { path = "../rawdaw-engine" }
# `SoftClipPatch` carries `From<SoftClipData>` so the master-FX
# graph builder can construct a runtime patch from the model's
# serialized data. The conversion is the seam between the two
# crates per the X0 design (model owns serialized types,
# rawdaw-fx owns runtime types + DSP).
rawdaw-model = { path = "../rawdaw-model" }
