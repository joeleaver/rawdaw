<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>rawdaw — main window · round 1</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #efece6; }
    body {
      font-family: "Inter Tight", ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    #root { min-height: 100%; }

    /* Annotation pin — used at debatable spots (ribbon placement). */
    .anno-pin {
      position: absolute;
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 8px 4px 4px;
      background: #fef4a8;
      color: #5a4a2a;
      border-radius: 12px;
      font-size: 11.5px;
      font-family: "Inter Tight", ui-sans-serif, system-ui, sans-serif;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12),
                  0 0 0 1px rgba(0,0,0,0.05);
      z-index: 5;
      max-width: 260px;
      line-height: 1.35;
    }
    .anno-num {
      flex: 0 0 auto;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: #c96442;
      color: #fff;
      font-weight: 700;
      font-size: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .anno-text strong { font-weight: 600; }
    .anno-text { padding-right: 4px; }

    /* Tiny leader line from a pin to its target */
    .anno-leader {
      position: absolute;
      pointer-events: none;
      z-index: 4;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Data fixture (plain JS) -->
  <script src="components/data.js"></script>

  <!-- Design canvas wrapper -->
  <script type="text/babel" src="components/design-canvas.jsx"></script>

  <!-- Component library -->
  <script type="text/babel" src="components/parts.jsx"></script>
  <script type="text/babel" src="components/topbar.jsx"></script>
  <script type="text/babel" src="components/library.jsx"></script>
  <script type="text/babel" src="components/arrangement.jsx"></script>
  <script type="text/babel" src="components/inspector.jsx"></script>
  <script type="text/babel" src="components/main-window.jsx"></script>

  <script type="text/babel">
    const { MainWindow, DesignCanvas, DCSection, DCArtboard } = window;

    // Tiny annotation primitive — light callouts at debatable choices only.
    const Anno = ({ x, y, n, children, w = 240 }) => (
      <div className="anno-pin" style={{ left: x, top: y, width: w }}>
        <span className="anno-num">{n}</span>
        <span className="anno-text">{children}</span>
      </div>
    );

    // Artboard 1: at rest, nothing selected.
    const ArtboardRest = () => (
      <div style={{ position: 'relative', width: 1600, height: 900 }}>
        <MainWindow selectedIdx={null} />
        {/* Annotation 1 — ribbon placement (debatable choice) */}
        <Anno x={1612} y={92} n={1} w={260}>
          <strong>Chord-loop ribbon</strong> sits between the ruler and the
          section lane in its own row. Alternative: overlay on the blocks —
          rejected because chord density &amp; section length aren&rsquo;t
          always 1:1, so collisions get ugly fast.
        </Anno>
        <svg className="anno-leader" style={{ left: 1560, top: 100, width: 60, height: 30 }}>
          <path d="M 0 14 L 50 14" stroke="#c96442" strokeWidth="1.5" fill="none" strokeDasharray="3 2" />
        </svg>

        {/* Annotation 2 — block density */}
        <Anno x={1612} y={196} n={2} w={260}>
          <strong>Section blocks</strong> use a soft tint of the identity
          color + 3 px left stripe + 1 px ring. Quiet enough that the
          arrangement still reads as the user&rsquo;s content, not chrome.
        </Anno>

        {/* Annotation 3 — Roman + absolute density */}
        <Anno x={1612} y={296} n={3} w={260}>
          <strong>Roman primary, absolute always visible</strong> in a
          smaller, dimmer line under the numeral — the bar is wide enough at
          24-bar zoom that it fits. On tight zooms, hide the absolute line
          and surface on hover.
        </Anno>

        {/* Annotation 4 — Rinch gap */}
        <Anno x={1612} y={416} n={4} w={260}>
          <strong>Rinch gaps:</strong> ruler ticks, draggable arrangement
          block, and the splitter between panes are custom work — Rinch
          ships Mantine-ish primitives but not these.
        </Anno>
      </div>
    );

    // Artboard 2: verse (base) selected at bar 5–8.
    const ArtboardSelected = () => (
      <div style={{ position: 'relative', width: 1600, height: 900 }}>
        <MainWindow selectedIdx={1} />

        {/* Annotation A — linked highlight */}
        <Anno x={1612} y={228} n="A" w={260}>
          <strong>Linked highlight.</strong> Selecting one <code>verse</code>
          block lifts every other SectionRef pointing at the same
          <code> SectionId</code> (here: bars 9–12 and 13–16) and lifts the
          chord-loop ribbon over the same bars. Reinforces &ldquo;edit once,
          propagate everywhere.&rdquo;
        </Anno>

        {/* Annotation B — variant chip */}
        <Anno x={1612} y={356} n="B" w={260}>
          <strong>Variant chip</strong> sits in the top-right of the block
          and is omitted when the block uses the section&rsquo;s default
          variant (so the &ldquo;stripped&rdquo; verse stands out).
        </Anno>

        {/* Annotation C — inspector header */}
        <Anno x={1612} y={496} n="C" w={260}>
          <strong>Inspector announces selection</strong> with the same color
          stripe + name treatment as the block, plus an instance count
          (3 in arrangement) and the bar range. Variant tabs sit right
          below; <code>stripped</code> is one click away.
        </Anno>

        {/* Annotation D — activation table */}
        <Anno x={1612} y={636} n="D" w={260}>
          <strong>Activation table sketch.</strong> One row per track,
          shows pattern + state (active / silent / inherit). Round 1
          fidelity only — the matrix gets its own round. Variant-level
          silences (<code>stripped</code>) display the asterisk.
        </Anno>
      </div>
    );

    const App = () => (
      <DesignCanvas>
        <DCSection
          id="main-window"
          title="rawdaw · main window"
          subtitle="round 1 — information hierarchy at rest + with a section selected">
          <DCArtboard id="rest"     label="A · At rest"               width={1880} height={900}>
            <ArtboardRest />
          </DCArtboard>
          <DCArtboard id="selected" label="B · Verse (base) selected" width={1880} height={900}>
            <ArtboardSelected />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
